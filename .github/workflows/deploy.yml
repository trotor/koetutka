name: Deploy to GitHub Pages

on:
  # Scheduled: every day at 6:00 UTC (8:00 Finnish time) - fetch new data
  schedule:
    - cron: '0 6 * * *'

  # Manual trigger - fetch new data
  workflow_dispatch:

  # On push to main branch - deploy HTML changes
  push:
    branches:
      - master
      - main
    # Also trigger on update_data tag - fetch new data
    tags:
      - 'update_data*'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @koetutka/shared build

      - name: Install dependencies
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/update_data')
        run: |
          pip install requests geopy

      - name: Download coordinates cache
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/update_data')
        uses: actions/cache@v4
        with:
          path: coordinates_cache.json
          key: coordinates-cache-${{ github.run_id }}
          restore-keys: |
            coordinates-cache-

      - name: Fetch event data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/update_data')
        run: |
          CURRENT_YEAR=$(date +%Y)
          CURRENT_MONTH=$(date +%m)
          echo "Fetching data for $CURRENT_YEAR..."
          python snj_kokeet.py --year "$CURRENT_YEAR"
          # Lokakuusta lähtien haetaan myös seuraavan vuoden data, sillä SNJ
          # julkaisee seuraavan vuoden koekalenterin tyypillisesti syksyllä.
          if [ "$CURRENT_MONTH" -ge 10 ]; then
            NEXT_YEAR=$((CURRENT_YEAR + 1))
            echo "Lokakuu tai myöhemmin — haetaan myös $NEXT_YEAR..."
            python snj_kokeet.py --year "$NEXT_YEAR"
          fi

      - name: Commit updated data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/update_data')
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add koetutka_*.json coordinates_cache.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update trial data"
          git push

      - name: Prepare deployment directory
        run: |
          mkdir -p _site/shared/dist
          cp index.html _site/
          cp styles.css _site/
          cp app.js _site/
          cp privacy.html _site/
          cp banner.jpg _site/
          cp favicon.ico _site/
          cp favicon-192.png _site/
          cp apple-touch-icon.png _site/
          cp -r shared/dist/* _site/shared/dist/
          # Check if data files exist (should be committed to repo)
          if ls koetutka_*.json 1> /dev/null 2>&1; then
            cp koetutka_*.json _site/
            echo "Data files found and copied"
          else
            echo "Warning: No data files found. Make sure to run with update_data tag to generate them."
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
